# Stage 1: extract the region of interest (ROI) of every recording into the ROI cache.
#   uv run python scripts/1_extract_roi.py dataset=ubfc_rppg roi=yolo5face36_tight
#
# Pick one file from each group below (or override on the command line).
defaults:
  - paths # configs/paths.yaml: cache_root
  - dataset: ubfc_rppg # configs/dataset/<name>.yaml
  - roi: yolo5face36_tight # configs/roi/<name>.yaml
  # MLflow tracking (configs/hydra/callbacks/); none = off.
  - override hydra/callbacks: mlflow
  # SLURM resources for -m runs; match the roi config. configs/hydra/launcher/<name>.yaml
  - override hydra/launcher: yolo5face
  - _self_

# false = skip videos already in the cache (a crashed job can just be rerun).
# true = rebuild every video even if the config is unchanged, e.g. after fixing code
# without bumping a `version`. Rebuild the preprocessing caches of this ROI cache too:
# they have the same key and would still hold the old ROIs. Not part of the cache key.
overwrite: false
